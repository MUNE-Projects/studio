# Aviso «versión lista para revisar»: envía la vista previa a Cloudflare (la web
# de la versión está en Supabase, 036_publicacion.sql; herramientas/desplegar.mjs)
# y abre una incidencia en el taller con el enlace a la vista previa y al Panel. La crea GitHub (github-actions), así que
# GitHub envía el email de aviso a quien vigila el almacén. Al publicar desde el
# Panel, publicar.yml la cierra.
#
# Lo lanza Claude al preparar una versión (receta 9).

name: Avisar de una versión lista para revisar
run-name: aviso ${{ inputs.promocion }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      promocion:
        required: true
        type: string
      version:
        required: true
        type: string
      cambios:
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: publicacion
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PROMOCION: ${{ inputs.promocion }}
      VERSION: ${{ inputs.version }}
      CAMBIOS: ${{ inputs.cambios }}
    steps:
      - name: Comprobar los datos recibidos
        run: |
          [[ "$PROMOCION" =~ ^[a-z0-9-]{1,60}$ ]] || { echo "::error::Promoción no válida"; exit 1; }
          [[ "$VERSION" =~ ^v[0-9]{1,5}$ ]] || { echo "::error::Versión no válida"; exit 1; }
          [[ ${#CAMBIOS} -le 2000 ]] || { echo "::error::Texto de cambios demasiado largo"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # una vista previa detrás de otra (y nunca a la vez que una publicación)
      - name: Enviar la vista previa a Cloudflare
        env:
          EJECUTOR_CLAVE: ${{ secrets.EJECUTOR_CLAVE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2706295406853446349339961bd45902
        run: node herramientas/desplegar.mjs vista-previa

      - name: Abrir el aviso
        run: |
          cuerpo=$(printf '%s\n' \
            "## 👉 Revisa antes de publicar" "" \
            "**Vista previa:** https://revision-experience.mune-projects.workers.dev/$PROMOCION/" "" \
            "**Publícala o pide cambios en MUNE Studio:** https://studio.mune-projects.workers.dev" "" \
            "## Qué cambia" "" "$CAMBIOS" "" \
            "_Este aviso se cierra solo cuando publiques $VERSION desde MUNE Studio._")
          gh issue create --repo "$REPO" --label revision \
            --title "$PROMOCION $VERSION · lista para revisar" --body "$cuerpo"
