# Aviso por email al equipo de MUNE: documentación nueva de una promotora,
# validaciones de planos comerciales y de la Experiencia 3D (aprobado o
# cambios pedidos) y versiones publicadas al aprobar la promotora.
#
# Lo lanzan la función «aviso-subida» de Supabase y el ejecutor (publicar.yml).
# Sale del Gmail de MUNE (secreto AVISOS_GMAIL_CLAVE), un email por aviso, como
# los avisos a la promotora. Va a la dirección del secreto AVISOS_MUNE_PARA (o,
# si no existe, al propio Gmail de MUNE). Gratis.
#
# La función solo le pasa el número del email («correo»): el asunto y el texto
# (con nombres de personas y documentos) están en el buzón de Supabase
# (046_correos.sql); el proceso los lee con la cuenta «ejecutor» y los borra al
# enviar. publicar.yml, sin datos de personas, pasa asunto, texto y enlace.

name: Aviso por email a MUNE
run-name: aviso a MUNE

on:
  workflow_dispatch:
    inputs:
      correo:
        description: número del email en el buzón de Supabase
        required: false
        type: string
        default: ''
      asunto:
        required: false
        type: string
        default: ''
      texto:
        required: false
        type: string
        default: ''
      enlace:
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CORREO: ${{ inputs.correo }}
      EJECUTOR_CLAVE: ${{ secrets.EJECUTOR_CLAVE }}
      ASUNTO: ${{ inputs.asunto }}
      TEXTO: ${{ inputs.texto }}
      ENLACE: ${{ inputs.enlace }}
      CLAVE: ${{ secrets.AVISOS_GMAIL_CLAVE }}
      PARA: ${{ secrets.AVISOS_MUNE_PARA }}
    steps:
      - name: Enviar
        shell: python3 {0}
        run: |
          import html, json, os, re, smtplib, ssl, sys, urllib.request
          from email.message import EmailMessage
          from email.utils import formataddr

          REMITENTE = 'hello.muneprojects@gmail.com'
          clave = os.environ.get('CLAVE', '').replace(' ', '')
          if not clave:
              sys.exit('::error::Falta el secreto AVISOS_GMAIL_CLAVE (contraseña de aplicación del Gmail de MUNE)')
          para = [c.strip() for c in (os.environ.get('PARA') or REMITENTE).split(',') if c.strip()]
          if not para or len(para) > 10 or not all(re.fullmatch(r'[^\s@,<>]+@[^\s@,<>]+\.[^\s@,<>]+', c) for c in para):
              sys.exit('::error::El secreto AVISOS_MUNE_PARA no tiene correos válidos')
          asunto, texto, enlace = os.environ['ASUNTO'], os.environ['TEXTO'], os.environ['ENLACE']
          correo = os.environ.get('CORREO', '')
          sesion = None
          if correo:
              if not re.fullmatch(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}', correo):
                  sys.exit('::error::Número de email no válido')
              SUPABASE = 'https://iowtdenlkxjqzlpwizgb.supabase.co'
              PUBLICA = 'sb_publishable_LLvwP-xexV-Hlz2R585IQQ_H2NfJebR'
              def pedir(ruta, cuerpo, token=None):
                  cab = {'apikey': PUBLICA, 'Content-Type': 'application/json'}
                  if token: cab['Authorization'] = f'Bearer {token}'
                  r = urllib.request.Request(SUPABASE + ruta, data=json.dumps(cuerpo).encode(), headers=cab, method='POST')
                  with urllib.request.urlopen(r, timeout=30) as res:
                      return json.loads(res.read().decode() or 'null')
              sesion = pedir('/auth/v1/token?grant_type=password', {'email': 'hello.muneprojects+ejecutor@gmail.com', 'password': os.environ['EJECUTOR_CLAVE']})['access_token']
              d = pedir('/rest/v1/rpc/correo_para_enviar', {'p_id': correo}, sesion)
              asunto, texto, enlace = d['asunto'], d['texto'], d['enlace']
          if not asunto or not texto or not enlace:
              sys.exit('::error::Falta el email (número del buzón, o asunto, texto y enlace)')
          asunto = asunto.replace('\n', ' ')[:200]
          texto = texto[:3000]
          if not re.fullmatch(r'https://(revision-)?(studio|panel|portal|experience|escaparate)\.mune-projects\.workers\.dev/[^\s"<>]*', enlace):
              sys.exit('::error::Enlace no válido')

          etiqueta = 'Abrir MUNE Studio' if re.search(r'//(revision-)?(studio|panel)\.', enlace) else 'Ver la experiencia publicada' if re.search(r'(experience|escaparate)\.', enlace) else 'Abrir'
          parrafos = ''.join(f'<p style="margin:0 0 14px">{html.escape(p).replace(chr(10), "<br>")}</p>' for p in texto.split('\n\n'))
          cuerpo_html = f'''<!doctype html><html lang="es"><body style="margin:0;background:#f5f3ef;font-family:Helvetica,Arial,sans-serif;color:#1c1c1a">
            <div style="max-width:560px;margin:0 auto;padding:28px 20px">
              <p style="font-size:12px;letter-spacing:.12em;color:#8b867d;margin:0 0 18px">MUNE STUDIO</p>
              <div style="background:#fcfbf9;border:1px solid #e6e3dd;border-radius:12px;padding:24px;font-size:15px;line-height:1.5">
                {parrafos}
                <p style="margin:20px 0 0"><a href="{html.escape(enlace)}" style="display:inline-block;background:#2f5d50;color:#fff;text-decoration:none;padding:11px 16px;border-radius:8px;font-weight:600">{etiqueta}</a></p>
              </div>
              <p style="font-size:12px;color:#8b867d;margin:18px 0 0">Aviso automático de MUNE.</p>
            </div></body></html>'''
          cuerpo_texto = f'{texto}\n\n{enlace}\n\nAviso automático de MUNE.'

          contexto = ssl.create_default_context()
          with smtplib.SMTP_SSL('smtp.gmail.com', 465, context=contexto, timeout=30) as smtp:
              smtp.login(REMITENTE, clave)
              for destino in para:
                  m = EmailMessage()
                  m['From'] = formataddr(('MUNE', REMITENTE))
                  m['To'] = destino
                  m['Subject'] = asunto
                  m.set_content(cuerpo_texto)
                  m.add_alternative(cuerpo_html, subtype='html')
                  smtp.send_message(m)
          if sesion:
              pedir('/rest/v1/rpc/correo_enviado', {'p_id': correo}, sesion)  # se borra del buzón
          print('Aviso enviado.')
