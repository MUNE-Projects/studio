# Aviso por email al equipo de MUNE: documentación nueva de una promotora,
# validaciones de planos comerciales y de la Experiencia 3D (aprobado o
# cambios pedidos) y versiones publicadas al aprobar la promotora.
#
# Lo lanzan la función «aviso-subida» de Supabase y el ejecutor (publicar.yml).
# Sale del Gmail de MUNE (secreto AVISOS_GMAIL_CLAVE), un email por aviso, como
# los avisos a la promotora. Va a la dirección del secreto AVISOS_MUNE_PARA (o,
# si no existe, al propio Gmail de MUNE). Gratis.

name: Aviso por email a MUNE
run-name: aviso a MUNE · ${{ inputs.asunto }}

on:
  workflow_dispatch:
    inputs:
      asunto:
        required: true
        type: string
      texto:
        required: true
        type: string
      enlace:
        required: true
        type: string

permissions: {}

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ASUNTO: ${{ inputs.asunto }}
      TEXTO: ${{ inputs.texto }}
      ENLACE: ${{ inputs.enlace }}
      CLAVE: ${{ secrets.AVISOS_GMAIL_CLAVE }}
      PARA: ${{ secrets.AVISOS_MUNE_PARA }}
    steps:
      - name: Enviar
        shell: python3 {0}
        run: |
          import html, os, re, smtplib, ssl, sys
          from email.message import EmailMessage
          from email.utils import formataddr

          REMITENTE = 'hello.muneprojects@gmail.com'
          clave = os.environ.get('CLAVE', '').replace(' ', '')
          if not clave:
              sys.exit('::error::Falta el secreto AVISOS_GMAIL_CLAVE (contraseña de aplicación del Gmail de MUNE)')
          para = [c.strip() for c in (os.environ.get('PARA') or REMITENTE).split(',') if c.strip()]
          if not para or len(para) > 10 or not all(re.fullmatch(r'[^\s@,<>]+@[^\s@,<>]+\.[^\s@,<>]+', c) for c in para):
              sys.exit('::error::El secreto AVISOS_MUNE_PARA no tiene correos válidos')
          asunto = os.environ['ASUNTO'].replace('\n', ' ')[:200]
          texto = os.environ['TEXTO'][:3000]
          enlace = os.environ['ENLACE']
          if not re.fullmatch(r'https://(revision-)?(panel|portal|escaparate)\.mune-projects\.workers\.dev/[^\s"<>]*', enlace):
              sys.exit('::error::Enlace no válido')

          etiqueta = 'Abrir MUNE Studio' if '//panel.' in enlace or '//revision-panel.' in enlace else 'Ver la experiencia publicada' if 'escaparate.' in enlace else 'Abrir'
          parrafos = ''.join(f'<p style="margin:0 0 14px">{html.escape(p).replace(chr(10), "<br>")}</p>' for p in texto.split('\n\n'))
          cuerpo_html = f'''<!doctype html><html lang="es"><body style="margin:0;background:#f5f3ef;font-family:Helvetica,Arial,sans-serif;color:#1c1c1a">
            <div style="max-width:560px;margin:0 auto;padding:28px 20px">
              <p style="font-size:12px;letter-spacing:.12em;color:#8b867d;margin:0 0 18px">MUNE STUDIO</p>
              <div style="background:#fcfbf9;border:1px solid #e6e3dd;border-radius:12px;padding:24px;font-size:15px;line-height:1.5">
                {parrafos}
                <p style="margin:20px 0 0"><a href="{html.escape(enlace)}" style="display:inline-block;background:#2f5d50;color:#fff;text-decoration:none;padding:11px 16px;border-radius:8px;font-weight:600">{etiqueta}</a></p>
              </div>
              <p style="font-size:12px;color:#8b867d;margin:18px 0 0">Aviso automático de MUNE.</p>
            </div></body></html>'''
          cuerpo_texto = f'{texto}\n\n{enlace}\n\nAviso automático de MUNE.'

          contexto = ssl.create_default_context()
          with smtplib.SMTP_SSL('smtp.gmail.com', 465, context=contexto, timeout=30) as smtp:
              smtp.login(REMITENTE, clave)
              for destino in para:
                  m = EmailMessage()
                  m['From'] = formataddr(('MUNE', REMITENTE))
                  m['To'] = destino
                  m['Subject'] = asunto
                  m.set_content(cuerpo_texto)
                  m.add_alternative(cuerpo_html, subtype='html')
                  smtp.send_message(m)
          print('Aviso enviado.')
