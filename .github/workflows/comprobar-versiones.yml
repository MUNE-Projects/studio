# Comprobación de solo lectura: ¿responden las versiones antiguas del Worker «experience»?
# Lista sus versiones con la llave C y pide la portada de cada una por su dirección
# de versión. No despliega ni cambia nada.
name: Comprobar versiones de Cloudflare
on:
  push:
    branches: [comprobar-cloudflare]
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 2706295406853446349339961bd45902
    steps:
      - name: Versiones y direcciones
        run: |
          set -u
          npx --yes wrangler@4.147.0 versions list --name experience --json > versiones.json 2> error.txt || { tail -5 error.txt; exit 1; }
          node -e '
            const v = JSON.parse(require("fs").readFileSync("versiones.json","utf8"));
            console.log("Versiones del Worker experience:", v.length);
            require("fs").writeFileSync("ids.txt", v.slice(-40).map((x) => (x.id || x.version_id || "").slice(0, 8)).filter(Boolean).join("\n"));
            const fechas = v.map((x) => x.metadata?.created_on || x.created_on).filter(Boolean).sort();
            console.log("Más antigua:", fechas[0], "· más reciente:", fechas.at(-1));
          '
          echo "--- direcciones generales"
          for u in https://experience.mune-projects.workers.dev/ https://revision-experience.mune-projects.workers.dev/; do echo "$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 $u) $u"; done
          echo "--- dirección propia de cada versión (portada)"
          n=0; ok=0
          while read -r id; do n=$((n+1)); c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$id-experience.mune-projects.workers.dev/"); [ "$c" = "200" ] && ok=$((ok+1)); echo "$c versión $id"; done < ids.txt
          echo "Versiones probadas: $n · responden con la web: $ok"
