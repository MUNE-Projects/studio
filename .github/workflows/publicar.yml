# Brazo ejecutor: publica o vuelve atrás una promoción cuando la administradora
# pulsa el botón de MUNE Studio, o cuando la promotora valida todo lo enviado en
# una promoción con «Publicar al aprobar la promotora» (022).
#
# Lo lanzan la función «ejecutar» de Supabase (botón de MUNE Studio, después de
# comprobar que quien pulsa es administradora con contraseña + código del
# móvil) y la función «aviso-subida» (publicación al aprobar la promotora,
# después de comprobar que esa versión está validada entera). Las dos usan la
# llave A, que únicamente permite arrancar procesos de este almacén.
#
# Desde la decisión 60 (036_publicacion.sql) no escribe nada en GitHub: apunta la
# publicación en Supabase y envía la web directamente a Cloudflare.
#
# Llaves que usa (secretos de este almacén):
#  · EJECUTOR_CLAVE: la cuenta «ejecutor» de MUNE en Supabase, que solo puede
#    leer las versiones y publicarlas o volver atrás;
#  · CLOUDFLARE_API_TOKEN (llave C): enviar la web al Worker «experience».
#
# Toda la lógica y sus comprobaciones están en herramientas/publicacion.mjs
# (publicar o volver) y herramientas/desplegar.mjs (enviar a Cloudflare).

name: Publicar desde el Panel
run-name: ${{ inputs.accion }} ${{ inputs.promocion }} ${{ inputs.version }} · ${{ inputs.por }}

on:
  workflow_dispatch:
    inputs:
      accion:
        description: aprobar (publicar la versión en revisión) o volver (a una versión anterior)
        required: true
        type: choice
        options: [aprobar, volver]
      promocion:
        description: identificador de la promoción
        required: true
        type: string
      version:
        description: «aprobar», la versión revisada en la vista previa; «volver», la versión a la que volver (p. ej. v6)
        required: false
        type: string
        default: ''
      motivo:
        description: motivo (obligatorio para «volver»)
        required: false
        type: string
        default: ''
      por:
        description: quién lo aprueba
        required: true
        type: string
      solicitud:
        description: referencia de la solicitud del Panel
        required: false
        type: string
        default: ''
      avisar_para:
        description: publicación al aprobar la promotora · correos de su equipo para el aviso «publicada»
        required: false
        type: string
        default: ''
      nombre:
        description: publicación al aprobar la promotora · nombre de la promoción para los avisos
        required: false
        type: string
        default: ''

permissions:
  contents: read
  issues: write   # cerrar el aviso «lista para revisar» al publicar
  actions: write  # avisos por email de la publicación al aprobar la promotora

# una publicación detrás de otra, nunca dos a la vez
concurrency:
  group: publicacion
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACCION: ${{ inputs.accion }}
      PROMOCION: ${{ inputs.promocion }}
      VERSION: ${{ inputs.version }}
      MOTIVO: ${{ inputs.motivo }}
      POR: ${{ inputs.por }}
    steps:
      - name: Comprobar los datos recibidos
        run: |
          [[ "$PROMOCION" =~ ^[a-z0-9-]{1,60}$ ]] || { echo "::error::Promoción no válida"; exit 1; }
          [[ -n "$POR" && ${#POR} -le 120 ]] || { echo "::error::Falta quién aprueba"; exit 1; }
          [[ ${#MOTIVO} -le 500 ]] || { echo "::error::Motivo demasiado largo"; exit 1; }
          [[ "$VERSION" =~ ^v[0-9]{1,5}$ ]] || { echo "::error::Versión no válida"; exit 1; }
          if [[ "$ACCION" == volver ]]; then
            [[ -n "$MOTIVO" ]] || { echo "::error::Volver atrás exige un motivo"; exit 1; }
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publicar o volver
        env:
          EJECUTOR_CLAVE: ${{ secrets.EJECUTOR_CLAVE }}
        run: |
          if [[ "$ACCION" == aprobar ]]; then
            node herramientas/publicacion.mjs aprobar "$PROMOCION" --version "$VERSION" --aprobado-por "$POR" --confirmar
          else
            node herramientas/publicacion.mjs volver "$PROMOCION" "$VERSION" --motivo "$MOTIVO" --aprobado-por "$POR" --confirmar
          fi

      - name: Enviar a Cloudflare (producción y vista previa)
        env:
          EJECUTOR_CLAVE: ${{ secrets.EJECUTOR_CLAVE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2706295406853446349339961bd45902
        run: node herramientas/desplegar.mjs ambas

      - name: Cerrar el aviso «lista para revisar»
        if: inputs.accion == 'aprobar'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for n in $(gh issue list --repo "$REPO" --label revision --state open --search "\"$PROMOCION $VERSION\" in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$REPO" --comment "Publicada desde MUNE Studio por $POR."
          done

      - name: Avisar de la publicación al aprobar la promotora
        if: inputs.accion == 'aprobar' && inputs.por == 'Publicación al aprobar la promotora'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PARA: ${{ inputs.avisar_para }}
          NOMBRE: ${{ inputs.nombre }}
        run: |
          nombre="${NOMBRE:-$PROMOCION}"
          if [[ -n "$PARA" ]]; then
            gh workflow run aviso-promotora.yml --repo "$REPO" --ref main \
              -f para="$PARA" \
              -f asunto="$nombre · $VERSION publicada" \
              -f texto="Tu equipo ha validado todo lo que el equipo de MUNE preparó para la $VERSION de $nombre, y ya está publicada. En unos minutos la verás en la web." \
              -f enlace="https://experience.mune-projects.workers.dev/$PROMOCION/"
          fi
          gh workflow run aviso-mune.yml --repo "$REPO" --ref main \
            -f asunto="$nombre · $VERSION publicada al aprobar la promotora" \
            -f texto="La promotora ha validado todo lo enviado de la $VERSION de $nombre y se ha publicado sola. Si hay que deshacerlo, en MUNE Studio pulsa «Volver a una anterior»." \
            -f enlace="https://studio.mune-projects.workers.dev/#/promocion/$PROMOCION/resumen"
