# Supabase local, solo para la prueba de aislamiento (supabase/pruebas).
# Se levanta dentro de GitHub Actions (o en el ordenador de quien desarrolla)
# con datos inventados. No tiene nada que ver con el proyecto real, y sus
# claves son las de ejemplo que trae Supabase para trabajar en local.
project_id = "prueba-aislamiento"

[auth]
site_url = "http://127.0.0.1:5174/"
additional_redirect_urls = ["http://127.0.0.1:5174/"]
enable_signup = false

[auth.email]
enable_confirmations = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Buzón de pruebas: recoge los emails de invitación sin enviarlos de verdad.
[local_smtp]
enabled = true

# Funciones de supabase/funciones (lanzar.sh las copia a functions/).
[edge_runtime]
enabled = true

[edge_runtime.secrets]
CLAVE_PUBLICA = "sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH"
PORTAL_URL = "http://127.0.0.1:5174/"
ORIGENES_EXTRA = "http://127.0.0.1:5173"

[studio]
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false
